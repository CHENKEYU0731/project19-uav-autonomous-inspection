[flake8]
# Keep the ROS 2 Humble ament_flake8 baseline deterministic when hosted
# runners install optional Flake8 plugins that are absent from the base image.
extend-ignore = B902,C816,CNL100,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I100,I101,I202,Q000
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
